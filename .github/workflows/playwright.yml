name: Playwright tests 🎭

# The only browser-driven suite in CI — it replaced the Behat workflow, whose
# environment provisioning steps (up through MySQL) this one inherits.
#
# There is deliberately no Chrome/Chromedriver/Selenium/Java/Xvfb stack here:
# tests/playwright/features/actionInstall.feature installs Chamilo by clicking
# through the legacy web installer at /main/install/index.php, so Playwright's
# own browser handles both installing the app and testing it — one
# browser-automation stack for the whole job, not two.
#
# TWO PARALLEL JOBS (2026-10-12), not one sequential job running everything:
# "build" (the main, fully-parallel batch) and "specialcases" (SpecialCase1,
# then SpecialCase2, then any future SpecialCaseN — sequentially, but in its
# OWN job). They used to be one job, SpecialCase1 as a sequential step run
# AFTER the main batch finished. That worked, but doesn't scale: every future
# SpecialCaseN added would keep lengthening that SAME job, delaying the main
# batch's own result by the same amount, forever, even though nothing
# connects them functionally. GitHub Actions jobs with no `needs:` between
# them run concurrently by default on separate runners — splitting costs
# nothing on a public repo (unlimited free minutes) and buys two real things:
# wall-clock time ≈ max(main batch, SpecialCase chain) instead of their sum,
# AND full environment isolation (SpecialCase1 mutates ~100 platform
# settings; on a shared runner that was only safe because it ran strictly
# AFTER the main batch — on separate runners the question doesn't arise at
# all, since each job installs its own fresh Chamilo).
#
# The two jobs share their ~15-step provisioning (checkout through seeding
# fixtures) via the composite action in
# .github/actions/setup-chamilo-playwright/action.yml — written once, used by
# both jobs, so this file only has to describe what differs between them.
#
# EXTENSIBILITY for a future SpecialCase3 (and beyond): give its feature
# file(s) the SAME two tags every existing SpecialCase file already carries —
# a file-specific one (@specialcase3) AND the umbrella @specialcases (see
# package.json's test:playwright:specialcases script, and the exclusion in
# test:playwright's own --grep-invert). Ordering across SpecialCase files is
# governed by plain alphabetical file-path sort under --workers=1 (see
# playwright.config.ts's own `fullyParallel: false` comment) — a file named
# specialCase3*.feature needing specialCase2* to have already run is already
# satisfied by naming alone, exactly how specialCase1Sessions.feature already
# depends on specialCase1PlatformSettings.feature today. With that
# convention followed, THIS FILE NEEDS NO FURTHER CHANGES for a new
# SpecialCase: the "specialcases" job's existing single step already picks
# it up.
on: [ push, pull_request ]

# Cancel a still-running job when a newer commit lands on the same branch.
# Pushes to master are exempt, so every commit there keeps its own result.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
    build:
        name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.operating-system }}
        runs-on: ${{ matrix.operating-system }}

        strategy:
            fail-fast: false
            matrix:
                operating-system: [ ubuntu-latest ]
                # 8.4/8.5 temporarily disabled: focusing on getting the full suite green on
                # 8.3 first, then re-enabling the rest — that split also makes any future
                # failure easier to read as "version-specific" instead of muddying it with
                # whatever's still being worked out on 8.3 alone. Re-enable by uncommenting.
                php-versions: [ '8.3' ] # , '8.4', '8.5'
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup Chamilo for Playwright
                uses: ./.github/actions/setup-chamilo-playwright
                with:
                    php-version: ${{ matrix.php-versions }}

            # The step result is decided by check-results.mjs, NOT by
            # `playwright test`'s exit code. That is deliberate: the exit code is
            # non-zero for anything that went wrong anywhere in the process,
            # including work that is not a test, so it cannot distinguish "a test
            # regressed" from "a cleanup hook was slow". Twice in two days this
            # job went red on runs that were 410/410 green, because playwright-bdd
            # defers every tagged AfterAll into one worker-teardown phase that
            # blew its 90s budget AFTER the last test had already passed.
            #
            # A cleanup step running once every test has finished cannot
            # invalidate those tests, and two attempts at making that teardown fit
            # its budget both failed — so the durable fix is to stop asking the
            # exit code a question it cannot answer. The checker still fails the
            # build on any failed test, and on a TRUNCATED run (--min-tests),
            # which is the loophole a naive `|| true` would leave open. Non-test
            # errors are printed as warnings so they stay visible and fixable.
            -   name: Playwright tests
                env:
                    BASE_URL: http://localhost
                run: |
                    yarn test:playwright || echo "::warning::playwright exited non-zero — deferring to the result check below"
                    node tests/playwright/scripts/check-results.mjs \
                      --report var/test-results/playwright/results.json \
                      --min-tests 439 \
                      --label "main batch"

            -   name: Upload Playwright report on failure
                if: failure()
                uses: actions/upload-artifact@v7
                with:
                    name: playwright-report-php${{ matrix.php-versions }}
                    path: |
                        var/test-results/playwright/report
                        var/test-results/playwright/results
                        var/test-results/playwright/results.json
                    retention-days: 7
                    if-no-files-found: ignore

            -   name: Upload provisioning logs on failure
                if: failure()
                uses: actions/upload-artifact@v7
                with:
                    name: provisioning-logs-php${{ matrix.php-versions }}
                    path: /var/log/apache2/error.log
                    retention-days: 7
                    if-no-files-found: ignore

    # Runs in its own job, in PARALLEL with "build" above (no `needs:`
    # between them) — see this file's own top-of-file comment for why.
    specialcases:
        name: PHP ${{ matrix.php-versions }} SpecialCases on ${{ matrix.operating-system }}
        runs-on: ${{ matrix.operating-system }}

        strategy:
            fail-fast: false
            matrix:
                operating-system: [ ubuntu-latest ]
                php-versions: [ '8.3' ] # , '8.4', '8.5'
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup Chamilo for Playwright
                uses: ./.github/actions/setup-chamilo-playwright
                with:
                    php-version: ${{ matrix.php-versions }}

            # ONE step, not one per SpecialCase: test:playwright:specialcases
            # greps the umbrella @specialcases tag every SpecialCase file
            # carries, so SpecialCase1 (PlatformSettings, then Sessions —
            # both @specialcase1) and SpecialCase2 (Registration, then
            # TeacherTools, then TutorWorkflow — all three @specialcase2) run
            # as one ordered sequence under a single --workers=1 invocation.
            # Ordering within AND across SpecialCase groups is the same
            # plain alphabetical file-path sort already relied on everywhere
            # else in this suite (playwright.config.ts's `fullyParallel:
            # false`) — "specialCase1..." sorts before "specialCase2...",
            # and within SpecialCase2, "...Registration" before
            # "...TeacherTools" before "...TutorWorkflow" (the last of
            # which deliberately owns tearing down the shared parkur01
            # fixture Registration created, precisely BECAUSE it's the one
            # that sorts — and therefore runs — last; see that file's own
            # header comment for the full reasoning and the real bug that
            # taught it).
            #
            # --min-tests 20 = SpecialCase1's 11 scenarios (5 +
            # PlatformSettings' "Tear down" + Sessions' own "Teardown
            # special case 1 sessions") + SpecialCase2's 9 (1 Registration +
            # 3 TeacherTools + 5 TutorWorkflow, one of which is its own
            # "Teardown — delete the tutors and parkur01"). Recount with
            # `yarn playwright test --grep "@specialcases" --list` if this
            # ever drifts out of sync with a newly added scenario.
            #
            # Same retries/trace override as the old dedicated SpecialCase1
            # step, now covering SpecialCase2 too: these scenarios are
            # heavily non-idempotent (they create sessions, courses, extra
            # fields, user accounts), so a retry running against the SAME
            # database a first attempt partially mutated produces a second,
            # unrelated-looking failure instead of a clean one — confirmed
            # live for SpecialCase1 on 2026-08-26, and the same hazard
            # applies to SpecialCase2's own account/course creation.
            -   name: Playwright SpecialCases tests
                env:
                    BASE_URL: http://localhost
                run: |
                    yarn test:playwright:specialcases || echo "::warning::playwright exited non-zero — deferring to the result check below"
                    node tests/playwright/scripts/check-results.mjs \
                      --report var/test-results/playwright/results.json \
                      --min-tests 20 \
                      --label "SpecialCases"

            -   name: Upload Playwright report on failure
                if: failure()
                uses: actions/upload-artifact@v7
                with:
                    name: playwright-report-specialcases-php${{ matrix.php-versions }}
                    path: |
                        var/test-results/playwright/report
                        var/test-results/playwright/results
                        var/test-results/playwright/results.json
                    retention-days: 7
                    if-no-files-found: ignore

            -   name: Upload provisioning logs on failure
                if: failure()
                uses: actions/upload-artifact@v7
                with:
                    name: provisioning-logs-specialcases-php${{ matrix.php-versions }}
                    path: /var/log/apache2/error.log
                    retention-days: 7
                    if-no-files-found: ignore
