name: PHPUnit 🐛

on: [push, pull_request]

permissions:
  contents: read

# Cancel a still-running job when a newer commit lands on the same branch.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.operating-system }}
        runs-on: ${{ matrix.operating-system }}

        strategy:
            fail-fast: false
            matrix:
                operating-system: [ubuntu-latest]
                php-versions: ['8.3']

        # Set explicitly so a locally modified .env.test can never point CI at
        # another database.
        env:
            DATABASE_HOST: '127.0.0.1'
            DATABASE_PORT: '3306'
            DATABASE_NAME: 'chamilo_test'
            DATABASE_USER: 'root'
            DATABASE_PASSWORD: 'root'

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup PHP, with composer and extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, gd, json, soap, zip, bcmath
                  ini-values: post_max_size=256M, max_execution_time=600, memory_limit=4096M, date.timezone=Europe/Paris
                  coverage: pcov

            - name: Start mysql service
              run: |
                  sudo /etc/init.d/mysql start

            - name: Get composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache composer dependencies
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install dependencies with composer
              run: composer install --no-progress

            - name: Install assets
              run: php bin/console assets:install

            # corepack plus the committed .yarn/releases binary already pin the
            # version declared in package.json, so nothing is installed here.
            - name: Install Yarn
              run: |
                  sudo corepack enable
                  yarn --version

            - name: Get yarn cache directory
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

            - name: Cache yarn dependencies
              uses: actions/cache@v6
              with:
                  path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
                  restore-keys: ${{ runner.os }}-yarn-

            # The functional tests render Twig layouts calling encore_entry_*,
            # so they need public/build/entrypoints.json — a dev build produces
            # it without paying for minification.
            - name: Install JS dependencies
              run: |
                  yarn install
                  yarn run encore dev

            - name: Check PHP settings
              run: |
                  php -ini
                  php -v
                  php -m

            - name: Setup test database
              run: |
                  php bin/console --env=test cache:clear
                  php bin/console --env=test doctrine:database:create
                  php bin/console --env=test doctrine:schema:create
                  php bin/console --env=test doctrine:fixtures:load --no-interaction

            - name: Run PHPUnit tests
              run: php bin/phpunit --testdox --coverage-clover clover.xml

            - name: Coverage
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
                  files: ./clover.xml
                  name: codecov-umbrella # optional
                  fail_ci_if_error: false
                  verbose: true
