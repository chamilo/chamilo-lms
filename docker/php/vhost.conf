# __HTTP_PORT__ is substituted at build time from the HTTP_PORT build arg
# (docker/php/Dockerfile) so the listen port is defined in exactly one place.
<VirtualHost *:__HTTP_PORT__>
    ServerName localhost
    DocumentRoot /var/www/chamilo/public/

    RewriteEngine On

    <Directory /var/www/chamilo/public>
        AllowOverride All
        Require all granted
        Options -MultiViews
        DirectoryIndex index.php
    </Directory>

    # Mirrors public/main/install/apache.dist.conf
    <LocationMatch "/\.git">
        Require all denied
    </LocationMatch>
    <LocationMatch "/documentation">
        Require all denied
    </LocationMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
    # Apache would otherwise buffer these behind the container log driver
    LogLevel warn
</VirtualHost>
