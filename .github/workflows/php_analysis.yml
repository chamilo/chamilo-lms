name: PHP static analysis ✨

on: [push, pull_request]

# Cancel a still-running job when a newer commit lands on the same branch.
# Pushes to master are exempt, so every commit there keeps its own result.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
    build:
        name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.operating-system }}
        runs-on: ${{ matrix.operating-system }}

        strategy:
            fail-fast: false
            matrix:
                operating-system: [ubuntu-latest]
                php-versions: ['8.3']

        # The runner image stopped shipping MySQL with ubuntu-26.04, so the old
        # `sudo /etc/init.d/mysql start` step now fails with "command not found".
        # A service container replaces it. The DATABASE_HOST of .env.test is
        # 127.0.0.1, which is what this container needs: PDO reads localhost as
        # a Unix socket, and the container only publishes a TCP port.
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                # Without a health check the job starts before the server
                # accepts connections.
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup PHP, with composer and extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, gd, json, soap, zip, bcmath
                  ini-values: post_max_size=256M, max_execution_time=600, memory_limit=4096M

#            - name: Composer validate
#              id: composer-validate
#              run: composer validate

            - name: Get composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache composer dependencies
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install dependencies with composer
              run: composer install --no-progress

            - name: Cache clear
              run: php bin/console cache:clear --no-warmup

            - name: Check Symfony requirements
              run: vendor/bin/requirements-checker

            - name: The PHP Security Checker
              uses: symfonycorp/security-checker-action@v5

            - name: Psalm
              id: psalm
              run: vendor/bin/psalm --show-info=false --output-format=github --shepherd

            - name: Create test database
              run: php bin/console --env=test doctrine:database:create

            - name: Doctrine Schema Validator
              run: php bin/console --env=test doctrine:schema:validate --skip-sync
