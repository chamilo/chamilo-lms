name: Playwright tests 🎭

# Runs alongside behat.yml, not instead of it — only a small subset of
# scenarios has been ported to Playwright so far (see tests/playwright/).
# Environment provisioning steps up through MySQL are copied from
# behat.yml on purpose, to stand up the same environment the Behat suite
# runs against.
#
# Unlike behat.yml, there is no Chrome/Chromedriver/Selenium/Java/Xvfb
# stack here at all: tests/behat/features/actionInstall.feature (the
# scenario that actually installs Chamilo by clicking through the legacy
# web installer at /main/install/index.php) has been ported to Playwright
# too (tests/playwright/features/actionInstall.feature), so Playwright's
# own browser now handles both installing the app and testing it — one
# browser-automation stack for the whole job, not two.
on: [ push, pull_request ]

jobs:
    build:
        name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.operating-system }}
        runs-on: ubuntu-24.04

        strategy:
            fail-fast: false
            matrix:
                operating-system: [ ubuntu-latest ]
                # 8.4/8.5 temporarily disabled: focusing on getting the full suite green on
                # 8.3 first, then re-enabling the rest — that split also makes any future
                # failure easier to read as "version-specific" instead of muddying it with
                # whatever's still being worked out on 8.3 alone. Re-enable by uncommenting.
                php-versions: [ '8.3' ] # , '8.4', '8.5'
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            # As of PHP 8.5, opcache is compiled into core (php-src RFC "Make OPcache a
            # non-optional part of PHP") and no longer ships as its own loadable
            # extension/package — there's no php8.5-opcache in ondrej/php, and
            # requesting the "opcache" extension by name would fail. Both spots below
            # that reference it (this apt package list, and the extensions: list two
            # steps down) skip it for 8.5 accordingly. Computed here in plain bash
            # rather than a GitHub Actions `${{ cond && a || b }}` expression — a first
            # attempt at that pattern broke on the classic JS-ternary-via-&&/||
            # pitfall (the "true" branch value was '', which is falsy, so `||` fell
            # through to the fallback branch instead — i.e. it did the opposite of
            # what was intended, and 8.5 tried to install php8.5-opcache anyway,
            # failing the whole apt-get install command). Extend the version check if
            # a future PHP version keeps this behavior, since it isn't range-proofed.
            -   name: Setup apache
                run: |
                    PHP_VERSION="${{ matrix.php-versions }}"
                    OPCACHE_PACKAGE="php${PHP_VERSION}-opcache"
                    if [ "$PHP_VERSION" = "8.5" ]; then
                      OPCACHE_PACKAGE=""
                    fi
                    sudo apt-get install software-properties-common
                    sudo add-apt-repository ppa:ondrej/php
                    sudo apt-get update
                    sudo apt-get install -y nodejs npm apache2 \
                      php${PHP_VERSION} \
                      php${PHP_VERSION}-common \
                      php${PHP_VERSION}-cli \
                      php${PHP_VERSION}-mysql \
                      php${PHP_VERSION}-bcmath \
                      php${PHP_VERSION}-curl \
                      php${PHP_VERSION}-gd \
                      php${PHP_VERSION}-intl \
                      php${PHP_VERSION}-ldap \
                      php${PHP_VERSION}-mbstring \
                      $OPCACHE_PACKAGE \
                      php${PHP_VERSION}-soap \
                      php${PHP_VERSION}-xml \
                      php${PHP_VERSION}-zip \
                      libapache2-mod-php${PHP_VERSION}
                    sudo a2enmod rewrite actions
                    sudo chmod 777 -R $HOME

            -   name: Setup PHP, with composer and extensions
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-versions }}
                    extensions: bcmath, ctype, curl, dom, gd, iconv, intl, json, ldap, mbstring, pdo_mysql, mysqli, soap, xml, zip${{ matrix.php-versions != '8.5' && ', opcache' || '' }}
                    ini-values: post_max_size=256M, max_execution_time=600, memory_limit=4096M, date.timezone=Europe/Paris, opcache.enable=1, opcache.memory_consumption=64M

            -   name: Get composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: Install dependencies with composer
                run: composer install --no-progress

            -   name: Install assets
                run: php bin/console assets:install

            -   name: Install Yarn
                run: |
                    sudo npm i -g npm
                    node --version
                    npm --version
                    sudo corepack enable
                    yarn set version stable
                    yarn --version

            -   name: Install JS dependencies
                run: yarn install

            -   name: Yarn run encore
                run: yarn run encore production

            -   name: Start mysql service
                run: sudo /etc/init.d/mysql start

            -   name: Install Playwright browsers
                run: yarn playwright install --with-deps chromium

            # Deliberately last, right before Apache is actually needed, not
            # right after `apt-get install apache2` back in "Setup apache".
            # A previous run showed 000-default.conf was still the stock
            # /var/www/html vhost by this point in the job, despite "Setup
            # apache" copying gh-apache into it and re-enabling the site
            # without error — something in between (most likely
            # shivammathur/setup-php@v2, which manages the Apache/PHP
            # integration) was resetting it. Applying the vhost swap here
            # instead, as the last write before first use, sidesteps that
            # regardless of which exact step was clobbering it.
            -   name: Configure apache vhost
                run: |
                    sudo a2dissite 000-default.conf
                    sudo cp -f ${{ github.workspace }}/.github/gh-apache /etc/apache2/sites-available/000-default.conf
                    sudo a2ensite 000-default.conf
                    sudo systemctl restart apache2

            -   name: Check apache is up
                run: |
                    sudo chmod 777 -R ${{ github.workspace }}
                    echo "--- apache2ctl -S (configured vhosts) ---"
                    sudo apache2ctl -S
                    echo "--- active 000-default.conf content ---"
                    cat /etc/apache2/sites-enabled/000-default.conf
                    echo "--- does the install file actually exist here? ---"
                    ls -la "${{ github.workspace }}/public/main/install/index.php"
                    echo "--- curl -v ---"
                    curl -v http://localhost/main/install/index.php

            -   name: Install chamilo
                env:
                    BASE_URL: http://localhost
                run: |
                    yarn test:playwright:install
                    sed -i "s/APP_ENV='dev'/APP_ENV='prod'/g" .env
                    sed -i "s/APP_DEBUG='1'/APP_DEBUG='0'/g" .env
                    printf '\nwhen@prod:\n    framework:\n        http_cache: true\n' >> config/packages/framework.yaml
                    sudo php bin/console cache:clear
                    sudo chmod -R 777 var

            # Diagnostic for a "Create tests users successfully" failure: admin/admin
            # login gets a genuine 401 {"error":"Invalid credentials."} from the
            # server, confirmed via plain curl (no Playwright/browser involved), so
            # it's a real server-side rejection, not a timing/client bug. Leading
            # hypothesis, per this project's own conventions (see CLAUDE.md's note
            # on testing admin JWT access: "the fixture admin/admin account may
            # lack [a UserAuthSource::PLATFORM row] in a fresh test DB"): the web
            # installer's admin-account creation may not register that row the way
            # the createUser() PHP helper does, and UserAuthSourceListener rejects
            # any plain (non-LDAP/OAuth2) login for a user missing it — this is the
            # first time fresh-install-then-admin-login has been exercised
            # end-to-end, so if that gap exists it would never have surfaced before.
            #
            # UPDATE: ruled out. A run confirmed the admin row exists/is active
            # (status=1, active=1) AND has the expected user_auth_source row
            # (authentication='platform') — so UserAuthSourceListener isn't what's
            # rejecting this login. All 3 PHP versions fail identically on this
            # exact scenario, so it's not version-specific either. The stored
            # password is a well-formed bcrypt hash ($2y$13$...), but that alone
            # doesn't prove it's actually the hash *of* "admin" — bcrypt hashes an
            # empty string just as happily. password_verify() directly against the
            # raw stored hash, bypassing Symfony's auth stack entirely, answers
            # that unambiguously: true means something else in the security stack
            # is rejecting a genuinely-correct password; false confirms "admin"
            # isn't actually what got saved (most likely candidate: the install
            # wizard's password field is PrimeVue's <Password> widget, a richer
            # component than a plain <input> — its v-model may not have picked up
            # Playwright's fill() the way a plain input does).
            -   name: Verify admin login before seeding
                run: |
                    curl -s -X POST http://localhost/login_json \
                      -H "Content-Type: application/json" \
                      -d '{"username":"admin","password":"admin","_remember_me":false}' \
                      -w "\nHTTP status: %{http_code}\n"
                    echo "--- admin user row ---"
                    php bin/console doctrine:query:sql "SELECT id, username, status, active FROM user WHERE username = 'admin'"
                    echo "--- admin user_auth_source rows (expect one with authentication='platform') ---"
                    php bin/console doctrine:query:sql "SELECT * FROM user_auth_source WHERE user_id = (SELECT id FROM user WHERE username = 'admin')"
                    echo "--- admin stored password hash ---"
                    php bin/console doctrine:query:sql "SELECT password FROM user WHERE username = 'admin'"
                    echo "--- does 'admin' verify against that exact hash? ---"
                    HASH=$(mysql -uroot -proot chamilo -N -B -e "SELECT password FROM user WHERE username='admin'")
                    php -r "var_dump(password_verify('admin', '$HASH'));"

            # `playwright test` clears its outputDir at the start of every invocation,
            # and "Install chamilo" / "Seed test users" / "Playwright tests" below are
            # three separate invocations — so the install run's trace (needed to see
            # the actual #passForm value at submission time, see project memory) would
            # otherwise get wiped the moment "Seed test users" starts, long before the
            # end-of-job "Upload Playwright report on failure" step ever runs. Uploading
            # it here, immediately, with if: always() (not if: failure() — the install
            # scenario itself currently passes) is the only way to actually capture it.
            -   name: Upload install trace
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: playwright-install-trace-php${{ matrix.php-versions }}
                    path: |
                        var/test-results/playwright/report
                        var/test-results/playwright/results
                    retention-days: 7
                    if-no-files-found: ignore

            # Seeds the fixed test accounts (mmosquera, acostea, ptook, etc.)
            # that the rest of the suite logs in as via "I am a teacher" /
            # "I am a student" / etc. — kept as its own step, run once,
            # separate from "Playwright tests" below, same reasoning as
            # keeping "Install chamilo" separate.
            -   name: Seed test users
                env:
                    BASE_URL: http://localhost
                run: yarn test:playwright:seed

            -   name: Playwright tests
                env:
                    BASE_URL: http://localhost
                run: yarn test:playwright

            -   name: Upload Playwright report on failure
                if: failure()
                uses: actions/upload-artifact@v7
                with:
                    name: playwright-report-php${{ matrix.php-versions }}
                    path: |
                        var/test-results/playwright/report
                        var/test-results/playwright/results
                    retention-days: 7
                    if-no-files-found: ignore

            -   name: Upload provisioning logs on failure
                if: failure()
                uses: actions/upload-artifact@v7
                with:
                    name: provisioning-logs-php${{ matrix.php-versions }}
                    path: /var/log/apache2/error.log
                    retention-days: 7
                    if-no-files-found: ignore
